[package]
name = "qualms-desktop"
version = "0.0.0"
description = "Qualms desktop application"
authors = ["Kieran"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "qualms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
